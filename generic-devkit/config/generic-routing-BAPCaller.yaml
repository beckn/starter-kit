# BAP Caller Routing — outbound requests from BAP to BPPs / CDS
#
# networkId "beckn.one/testnet" maps to the v2.0.0 context.networkId field.
# The adapter router resolves targetType "bpp" via DeDi registry lookup (bppId).
# The CDS URL below handles discover and catalog/publish; update it for your network.

routingRules:
  # Transaction & fulfillment actions: routed to the BPP via registry lookup
  - domain: "beckn.one/testnet"
    version: "2.0.0"
    targetType: "bpp"
    endpoints:
      - select
      - init
      - confirm
      - status
      - track
      - update
      - cancel
      - rate
      - support

  # Discovery: routed through the discovr onix instance's bapReceiver module
  # (docker-compose.onix-crawler.yml, onix-config/config.yaml), which fronts
  # discover for the world and forwards internally to catalog-discover-job
  # (see beckn-discovr/onix-config/routing-bap-receiver.yaml). Port 8091 is
  # onix-crawler's published port in that stack.
  - domain: "beckn.one/testnet"
    version: "2.0.0"
    targetType: "url"
    target:
      #url: "https://34.93.165.42.sslip.io/beckn"   # Replace with your Discover service endpoint
      url: "http://host.docker.internal:8091/bap/receiver"
    endpoints:
      - discover
