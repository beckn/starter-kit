# BAP Caller Routing — outbound requests from BAP to BPPs / CDS
#
# networkId "beckn.one/testnet" maps to the v2.0.0 context.networkId field.
# The adapter router resolves targetType "bpp" via DeDi registry lookup (bppId).
# The CDS URL below handles discover and catalog/publish; update it for your network.

routingRules:
  # Transaction & fulfillment actions: routed to the BPP via registry lookup
  - domain: "beckn.one/testnet"
    version: "2.0.0"
    targetType: "bpp"
    endpoints:
      - select
      - init
      - confirm
      - status
      - track
      - update
      - cancel
      - rate
      - support

  # Discovery: routed to Discover Service
  - domain: "beckn.one/testnet"
    version: "2.0.0"
    targetType: "url"
    target:
      # Prod Discover service (onix-discover on the discovr VM) — testing v1.7.0
      # RFC 9535 JSONPath filter grammar + onix-adapter 1.9.1 directly against prod.
      url: "https://34.93.165.42.sslip.io/beckn"
      # Stage alternate: url: "https://34.93.56.210.nip.io/beckn"
      # Local dev alternate: url: "http://host.docker.internal:8090/receiver"
    endpoints:
      - discover
