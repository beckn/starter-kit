# BPP Caller Routing — outbound on_* callbacks from BPP back to the originating BAP
#
# targetType "bap" resolves the BAP's callback URI via DeDi registry lookup (bapId).
#
# catalog/publish does NOT route through here -- it's handled entirely by the
# separate catalogPublish module (/catalog/publish in generic-bpp.yaml), an
# unsigned, same-operator call with no routing config and no on_publish
# callback at all.

routingRules:
  # All standard on_* callbacks: routed to the BAP via registry lookup
  - domain: "beckn.one/testnet"
    version: "2.0.0"
    targetType: "bap"
    endpoints:
      - on_discover
      - on_select
      - on_init
      - on_confirm
      - on_status
      - on_track
      - on_update
      - on_cancel
      - on_rate
      - on_support