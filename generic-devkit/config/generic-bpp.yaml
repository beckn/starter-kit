appName: "onix-generic-bpp"
log:
  level: debug
  destinations:
    - type: stdout
  contextKeys:
    - transactionId
    - messageId
http:
  port: 8082
  timeout:
    read: 30
    write: 30
    idle: 30
pluginManager:
  root: ./plugins
  becknConstants:
    disableRemoteRefresh: true

modules:
  # ─────────────────────────────────────────────────────────────────
  # BPP Receiver  — accepts action requests from BAPs
  # Listens at:  http://localhost:8082/bpp/receiver/
  # bppUri in Postman = https://bpp.example.com/bpp/receiver
  # ─────────────────────────────────────────────────────────────────
  - name: bppTxnReceiver
    path: /bpp/receiver/
    handler:
      type: std
      role: bpp
      httpClientConfig:
        maxIdleConns: 1000
        maxIdleConnsPerHost: 200
        idleConnTimeout: 300s
        responseHeaderTimeout: 5s
      plugins:
        registry:
          id: dediregistry
          config:
            timeout: 10
            retry_max: 3
            retry_wait_min: 100ms
            retry_wait_max: 500ms
        keyManager:
          id: simplekeymanager
          config:
            # Testnet sandbox subscriber registered on beckn.one/testnet
            # Replace with your own registered subscriber ID and keys for production
            subscriberId: bpp.example.com
            keyId: 76EU7ofwRCF1aobQkShARrf1PAUsNpHqWUJoynPu9w45YFKmzqaPmy
            signingPrivateKey: 393fVJJsfqssJCRAjedKR2cKAjSLrjU3t+bICQ5KzYM=
            signingPublicKey: CqVy97DW45bcZPPrWIYGe2ldl9C93NFeVciiAEYsvR0=
            encrPrivateKey: 393fVJJsfqssJCRAjedKR2cKAjSLrjU3t+bICQ5KzYM=
            encrPublicKey: CqVy97DW45bcZPPrWIYGe2ldl9C93NFeVciiAEYsvR0=
        cache:
          id: cache
          config:
            addr: redis:6379
        schemaValidator:
          id: schemav2validator
          config:
            cacheTTL: "3600"
            extendedSchema_enabled: "true"
            extendedSchema_cacheTTL: "86400"
            extendedSchema_maxCacheSize: "100"
            extendedSchema_downloadTimeout: "30"
            extendedSchema_allowedDomains: "raw.githubusercontent.com,schema.beckn.io"
        signValidator:
          id: signvalidator
        router:
          id: router
          config:
            routingConfig: ./config/generic-routing-BPPReceiver.yaml
        signer:
          id: signer
        payloadStore:
          id: payloadstore
          config:
            ttl: "24h"
            indexTTL: "25h"
            storeSignature: "true"
        middleware:
          - id: reqpreprocessor
            config:
              contextKeys: transactionId,messageId
              role: bpp
      steps:
        - validateSign
        - addRoute
        - validateSchema
        - signAck

  # ─────────────────────────────────────────────────────────────────
  # BPP Caller  — forwards on_* callbacks back to the originating BAP
  # Listens at:  http://localhost:8082/bpp/caller/
  # Postman bpp_adapter_url = http://localhost:8082/bpp/caller
  # ─────────────────────────────────────────────────────────────────
  - name: bppTxnCaller
    path: /bpp/caller/
    handler:
      type: std
      role: bpp
      httpClientConfig:
        maxIdleConns: 1000
        maxIdleConnsPerHost: 200
        idleConnTimeout: 300s
        responseHeaderTimeout: 5s
      plugins:
        registry:
          id: dediregistry
          config:
            timeout: 10
            retry_max: 3
            retry_wait_min: 100ms
            retry_wait_max: 500ms
        keyManager:
          id: simplekeymanager
          config:
            subscriberId: bpp.example.com
            keyId: 76EU7ofwRCF1aobQkShARrf1PAUsNpHqWUJoynPu9w45YFKmzqaPmy
            signingPrivateKey: 393fVJJsfqssJCRAjedKR2cKAjSLrjU3t+bICQ5KzYM=
            signingPublicKey: CqVy97DW45bcZPPrWIYGe2ldl9C93NFeVciiAEYsvR0=
            encrPrivateKey: 393fVJJsfqssJCRAjedKR2cKAjSLrjU3t+bICQ5KzYM=
            encrPublicKey: CqVy97DW45bcZPPrWIYGe2ldl9C93NFeVciiAEYsvR0=
        cache:
          id: cache
          config:
            addr: redis:6379
        schemaValidator:
          id: schemav2validator
          config:
            cacheTTL: "3600"
            extendedSchema_enabled: "true"
            extendedSchema_cacheTTL: "86400"
            extendedSchema_maxCacheSize: "100"
            extendedSchema_downloadTimeout: "30"
            extendedSchema_allowedDomains: "raw.githubusercontent.com,schema.beckn.io"
        router:
          id: router
          config:
            routingConfig: ./config/generic-routing-BPPCaller.yaml
        signer:
          id: signer
        signValidator:
          id: signvalidator
        payloadStore:
          id: payloadstore
          config:
            ttl: "24h"
            indexTTL: "25h"
            storeSignature: "true"
        middleware:
          - id: reqpreprocessor
            config:
              contextKeys: transactionId,messageId
              role: bpp
      steps:
        - addRoute
        - storePayload
        - validateSchema
        - sign
        - validateAckSign

  # ─────────────────────────────────────────────────────────────────
  # catalog/publish — DS-internal trigger for the catalog-publisher
  # plugin. Unsigned, same-operator call (not a network-facing Beckn
  # action): no validateSign/addRoute/signAck. Given one or more plain
  # Beckn Catalog objects, it diffs against what was last published
  # (baseline vs. incremental change file), signs the result, and
  # writes it under outputRoot. Public catalogs only in this phase.
  # Listens at: http://localhost:8082/catalog/publish
  # See beckn-onix's pkg/plugin/implementation/catalogpublisher/README.md
  # ─────────────────────────────────────────────────────────────────
  - name: catalogPublish
    path: /catalog/publish
    handler:
      type: catalogPublish
      role: bpp
      outputRoot: /beckn
      httpClientConfig:
        maxIdleConns: 1000
        maxIdleConnsPerHost: 200
        idleConnTimeout: 300s
        responseHeaderTimeout: 5s
      plugins:
        # registry+cache exist only to satisfy keyManager's constructor
        # (KeyManagerProvider.New always requires a RegistryLookup); the
        # publisher itself never calls either.
        registry:
          id: dediregistry
          config:
            timeout: 10
            retry_max: 3
            retry_wait_min: 100ms
            retry_wait_max: 500ms
        cache:
          id: cache
          config:
            addr: redis:6379
        keyManager:
          id: simplekeymanager
          config:
            subscriberId: bpp.example.com
            keyId: 76EU7ofwRCF1aobQkShARrf1PAUsNpHqWUJoynPu9w45YFKmzqaPmy
            signingPrivateKey: 393fVJJsfqssJCRAjedKR2cKAjSLrjU3t+bICQ5KzYM=
            signingPublicKey: CqVy97DW45bcZPPrWIYGe2ldl9C93NFeVciiAEYsvR0=
            encrPrivateKey: 393fVJJsfqssJCRAjedKR2cKAjSLrjU3t+bICQ5KzYM=
            encrPublicKey: CqVy97DW45bcZPPrWIYGe2ldl9C93NFeVciiAEYsvR0=
        catalogPublisher:
          id: catalogpublisher
          config:
            # No subscriberId here -- the handler derives it automatically
            # from keyManager.config.subscriberId above (the single source
            # of truth for which keyset gets loaded). Set it explicitly
            # here only if it must legitimately differ from keyManager's.
            # indexSchemaURL is likewise not configurable -- it's a
            # hardcoded package constant pending a shared becknconstants
            # home for canonical schema URLs.
            nextUpdateIn: "336h"
            fileValidityIn: "336h"
            # catalogBaseURL: the one public URL prefix outputRoot is
            # served under -- beckn-router's ngrok tunnel, at the /beckn/*
            # route added to install/Caddyfile (serves ../data/beckn
            # statically). Update this if your ngrok domain changes.
            catalogBaseURL: "https://angular-absently-gab.ngrok-free.dev/beckn"
        # Validates submitted catalogs before they're published: the
        # handler wraps them in {context:{action:"catalog/publish"},
        # message:{catalogs:[...]}} and validates that envelope against
        # catalog/publish's real message.catalogs[]:Catalog[] schema (no
        # type/location set -- same as bppTxnReceiver/bppTxnCaller above,
        # so it resolves the canonical protocol-specifications-v2 beckn.yaml
        # via becknConstants). checkPolicy (opapolicychecker) intentionally
        # left out here -- not needed yet.
        schemaValidator:
          id: schemav2validator
          config:
            cacheTTL: "3600"
